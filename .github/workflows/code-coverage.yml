name: Code Coverage

# Run on pushes to the default branch (to establish the baseline) and on pull requests (to compare against it).
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# A new push to a pull request makes the running tests obsolete. Never cancel the run on the default branch, it saves the
# coverage of the commit, which is the baseline of the pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs ask for the permissions they need
permissions: {}

jobs:
  coverage:
    name: Measure the coverage and comment on the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The permissions are downgraded to read-only by GitHub for pull requests from forks and by Dependabot, so they
      # do not grant write access to untrusted code. The comment of these pull requests is posted by the workflow
      # "Post coverage comment".
      pull-requests: write # Post the coverage comment on the pull request, and edit it on later runs
      contents: write # Push the coverage data of the default branch to the branch python-coverage-comment-action-data

    steps:
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The library has no requirements.txt, the dependencies are defined in pyproject.toml. Install the library in
      # editable mode, so the coverage is measured for the files of the checkout and not for a copy in site-packages.
      - name: Install dependencies for testing
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --editable ".[test]"
      # This creates the file .coverage. The settings (branch coverage, relative paths, source) are in the
      # [tool.coverage] sections of pyproject.toml
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

      # Comment on pull requests, and save the coverage of the default branch. Everything runs on GitHub, no data is sent
      # to another service.
      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ github.token }}

      # Pull requests from forks cannot post the comment, so hand it over to the workflow "Post coverage comment"
      - name: Store the pull request comment to be posted
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME in the other workflow accordingly
          name: python-coverage-comment-action
          # If you use a different name, update COMMENT_FILENAME in the other workflow accordingly
          path: python-coverage-comment-action.txt
