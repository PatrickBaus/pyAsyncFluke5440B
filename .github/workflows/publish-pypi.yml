name: Upload to pypi.org

on:
  # Triggers the workflow when a release is created
  release:
    types: [ published ]

  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Test and build
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  upload:
    name: Upload to PyPI
    needs:
      - tests
    # The version comes from the git tag. Run from a branch, it would be a development version like 1.5.1.dev3, which
    # does not belong on PyPI.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Download the tested distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.TWINE_TOKEN }}
