name: Post coverage comment

# Pull requests from forks and from Dependabot have no write access, so the workflow "Code Coverage" cannot comment on
# them. This workflow runs in the context of the repository after it has finished, and posts the comment, which the
# other workflow has stored as an artifact.
on:  # zizmor: ignore[dangerous-triggers] The code of the pull request is neither checked out nor executed. The only data that is used is the text of the comment in the artifact, which is posted as it is.
  workflow_run:
    workflows: ["Code Coverage"]
    types:
      - completed

concurrency:
  # Group by the branch of the pull request, so that the runs for different pull requests do not cancel each other.
  # `github.ref` is always the default branch on `workflow_run`.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    name: Post the coverage comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write # Post the comment, and edit it on later runs
      actions: read # Download the comment artifact of the triggering run
      contents: read

    steps:
      # DO NOT run actions/checkout here, for security reasons. For details, refer to
      # https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
