name: Upload to test.pypi.org

on:
  # Triggers the workflow on push to the master branch
  push:
    branches: [ "master" ]

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Test and build
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  upload:
    name: Upload to TestPyPI
    needs:
      - tests
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Download the tested distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.TWINE_TEST_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          # Each commit gets its own development version. This only skips the upload when a run is repeated.
          skip-existing: true
