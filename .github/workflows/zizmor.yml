# Audits the GitHub workflows for security issues, such as actions that are not pinned to a commit SHA
name: zizmor

on:
  push:
    branches: [ "master" ]
    paths: [ ".github/**", "requirements-workflows.txt" ]
  pull_request:
    paths: [ ".github/**", "requirements-workflows.txt" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Audit the workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-workflows.txt
      - name: Install zizmor
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-workflows.txt
      - name: Run zizmor
        run: |
          zizmor --format=github --offline .
